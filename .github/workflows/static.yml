# Publicação do Kamufla IA no GitHub Pages
name: Deploy Kamufla IA to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kamufla-ia-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato único
        uses: actions/upload-pages-artifact@v3
        with:
          name: kamufla-ia-pages
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: kamufla-ia-pages
